[package]
name = "dataforge-rs"
version = "0.1.0"
edition = "2021"
description = "Governed data engineering and analysis terminal application"
license = "MIT"

[[bin]]
name = "dataforge-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.24", default-features = false, features = ["png"] }
ratatui = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "process", "time"] }

[dev-dependencies]
tempfile = "3.10"
